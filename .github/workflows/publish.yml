name: Publish packages

# Publishes changed @tenonhq/dovetail-* packages to npm on every merge to main.
#
# Flow: build all packages -> test all packages -> publish the packages that
# changed in the merge -> commit the version bumps back to main -> tag + cut a
# GitHub Release. Orchestration lives in Scripts/publish-on-merge.js.
#
# Branch protection on main is enforced by a Repository Ruleset that requires a
# PR + review for human-authored changes. The postpublish version-bump commit
# bypasses the ruleset via a deploy key (RELEASE_SSH_KEY secret) — an SSH
# keypair that is repo-scoped, not tied to any individual, and listed as a
# DeployKey bypass actor in the ruleset. The release commit is tagged [skip ci]
# and the job's if-guard matches 'chore(release):' as a second fence so the
# postpublish push never re-triggers this workflow.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — detect and report, but do not publish"
        type: boolean
        default: true
      base:
        description: "Diff base — commit/ref to detect changes from (default: previous commit)"
        type: string
        default: ""

# Serialize publish runs so two quick merges never race on the registry.
concurrency:
  group: dovetail-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Belt-and-braces: skip the workflow's own release commits. The [skip ci]
    # tag in the commit message already prevents the trigger.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: write # push the release commit, create tags + Releases
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the merge can be diffed

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 LTS ships npm 10.x; npm >= 11.5.1 is required for OIDC /
      # Trusted Publishing. Upgrade in place rather than tracking a newer Node.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: node Scripts/run-workspaces.js prepack

      - name: Test all packages
        run: node Scripts/run-workspaces.js test

      # Guard: every internal @tenonhq/dovetail-* range must be a floating
      # ~0.0.x. A caret hard-pin (^0.0.x) or wildcard (*) would force consumers
      # to set an overrides block / --legacy-peer-deps. Blocks the publish if a
      # stale pin slips back in. The guard's own unit tests run first.
      - name: Check internal dependency ranges
        run: |
          node --test Scripts/normalize-internal-deps.test.js
          node Scripts/normalize-internal-deps.js --check

      # The postpublish version-bump commit pushes directly to main, bypassing
      # the Repository Ruleset as a registered deploy key. The key is stored as
      # the RELEASE_SSH_KEY repo secret and added as a DeployKey bypass actor.
      - name: Wire release key for branch push
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run — skipping release key wire"
            exit 0
          fi
          if [ -z "$RELEASE_SSH_KEY" ]; then
            echo "::error::RELEASE_SSH_KEY secret is not configured — add the deploy key private key; see Scripts/PUBLISHING.md"
            exit 1
          fi
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          printf '%s\n' "$RELEASE_SSH_KEY" > /tmp/release_key
          chmod 600 /tmp/release_key
          echo "GIT_SSH_COMMAND=ssh -i /tmp/release_key" >> "$GITHUB_ENV"
          git remote set-url origin git@github.com:TenonHQ/Dovetail.git

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — packages without a Trusted Publisher configured on npmjs.com will fail to publish."
          fi
          # A manual run may pass an explicit diff base; a push uses the prior commit.
          base="${{ github.event.before }}"
          if [ -n "$INPUT_BASE" ]; then base="$INPUT_BASE"; fi
          args=(--base="$base" --head="${{ github.sha }}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          # Tee stdout so the Slack notifier can report which packages reached
          # npm even if a later stage (the bump-push to main) fails. pipefail is
          # on by default in GitHub's bash shell, so the script's exit code — not
          # tee's — determines this step's success.
          node Scripts/publish-on-merge.js "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # Post the publish outcome (success OR failure) to Slack #deployment so a
      # red run is never silent. The common silent failure is npm publishing
      # fine but the post-publish bump-push to main being rejected by branch
      # protection (GH006/GH013) — which leaves npm ahead of main. Reads the
      # SLACK_WEBHOOK_URL repo secret; if it is unset the notifier logs a warning
      # and exits 0, so it never fails the release. Skipped on dry runs.
      - name: Notify Slack (#deployment)
        if: ${{ always() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          IS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          PUBLISH_LOG: ${{ runner.temp }}/publish.log
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: node Scripts/notify-slack-publish.js
