name: Publish packages

# Publishes changed @tenonhq/dovetail-* packages to npm on every merge to main.
#
# Flow: build all packages -> test all packages -> publish the packages that
# changed in the merge -> commit the version bumps back to main -> tag + cut a
# GitHub Release. Orchestration lives in Scripts/publish-on-merge.js.
#
# The release commit is tagged [skip ci] (and matched by the job's if-guard) so
# it never re-triggers this workflow. Branch protection blocks direct pushes to
# main, so the version-bump commit is delivered via a self-approved squash PR
# that auto-merges. The PR title carries [skip ci]; the squash commit subject
# inherits it, preventing the merge from re-triggering this workflow.

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — detect and report, but do not publish"
        type: boolean
        default: true
      base:
        description: "Diff base — commit/ref to detect changes from (default: previous commit)"
        type: string
        default: ""

# Serialize publish runs so two quick merges never race on the registry.
concurrency:
  group: dovetail-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Belt-and-braces: skip the workflow's own release commits. The [skip ci]
    # tag in the commit message already prevents the trigger.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    permissions:
      contents: write # push the release commit, create tags + Releases
      id-token: write # OIDC token for npm Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the merge can be diffed

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Node 22 LTS ships npm 10.x; npm >= 11.5.1 is required for OIDC /
      # Trusted Publishing. Upgrade in place rather than tracking a newer Node.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: node Scripts/run-workspaces.js prepack

      - name: Test all packages
        run: node Scripts/run-workspaces.js test

      # Guard: every internal @tenonhq/dovetail-* range must be a floating
      # ~0.0.x. A caret hard-pin (^0.0.x) or wildcard (*) would force consumers
      # to set an overrides block / --legacy-peer-deps. Blocks the publish if a
      # stale pin slips back in. The guard's own unit tests run first.
      - name: Check internal dependency ranges
        run: |
          node --test Scripts/normalize-internal-deps.test.js
          node Scripts/normalize-internal-deps.js --check

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          INPUT_BASE: ${{ inputs.base }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not set — packages without a Trusted Publisher configured on npmjs.com will fail to publish."
          fi
          # A manual run may pass an explicit diff base; a push uses the prior commit.
          base="${{ github.event.before }}"
          if [ -n "$INPUT_BASE" ]; then base="$INPUT_BASE"; fi
          args=(--base="$base" --head="${{ github.sha }}")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node Scripts/publish-on-merge.js "${args[@]}"
