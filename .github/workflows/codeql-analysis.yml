name: "Code scanning - action"

# CodeQL advanced setup (GitHub "default setup" is not configured for this
# repo, so this workflow is the only code scanner). Upgraded from the
# codeql-action v1 template, which GitHub retired in Jan 2023 and which now
# fails the CodeQL-Build job on every run.
#
# The job id stays `CodeQL-Build` so the check name and the analysis category
# keep matching existing alert history.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 4"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  CodeQL-Build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # JS/TS needs no build: buildless extraction reads the sources directly.
      # `actions` scans the workflows themselves (injection, token scope).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
