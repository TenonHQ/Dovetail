<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dovetail — Update Sets</title>
  <script>
    /* Apply the saved theme before first paint to avoid a flash of light. */
    (function () {
      try {
        var t = localStorage.getItem("cp-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-left">
      <button class="sidebar-toggle" id="sidebar-toggle" title="ClickUp Tasks" style="display:none;">Tasks</button>
      <svg class="brand-mark" viewBox="0 0 55 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M34.3254 13.7847H48.0563H54.9235V0H48.0563H34.3254H20.5946H6.8637H0V13.7847H6.8637H20.5946V27.5693H34.3254V13.7847Z" fill="#00663C"></path>
        <path d="M54.9235 41.354V27.5693H48.0563H34.3254V41.354H20.5946V27.5693H6.8637H0V41.354V55.1387H20.5946H34.3254H54.9235V41.354Z" fill="#00663C"></path>
      </svg>
      <h1><span>Dovetail</span> Update Sets</h1>
    </div>
    <div class="header-right">
      <button class="btn-refresh" id="refresh-btn" title="Refresh scopes and update sets">Refresh</button>
      <a class="btn-refresh" href="/claude-plans" title="Claude plans and diagrams pushed via MCP">Claude Plans</a>
      <a class="btn-refresh" href="/todos" title="Priority TODO checklist">TODO</a>
      <button class="cp-theme-toggle" id="cp-theme-toggle" type="button"
        aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <div class="active-task-chip" id="active-task-chip" style="display:none;"></div>
      <div class="instance-badge" id="instance-badge">Loading...</div>
    </div>
  </header>

  <div class="layout">
    <!-- ClickUp Task Sidebar -->
    <div class="sidebar collapsed" id="task-sidebar">
      <div class="sidebar-header">
        <h2>ClickUp Tasks</h2>
        <button class="sidebar-close" id="sidebar-close">&times;</button>
      </div>
      <div class="sidebar-active-task" id="active-task-banner" style="display:none;"></div>
      <div class="sidebar-filters" id="status-filters"></div>
      <div class="sidebar-search">
        <input type="text" id="task-search" placeholder="Search tasks..." class="task-search-input" />
      </div>
      <div class="sidebar-task-toggles" id="task-toggles"></div>
      <div class="sidebar-tasks" id="task-list">
        <div class="loading">Select statuses to load tasks...</div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content">
      <div class="recent-edits-panel" id="recent-edits-panel" style="display:none;">
        <h2 class="recent-edits-title">Recent Edits</h2>
        <div class="recent-edits-list" id="recent-edits-list"></div>
      </div>
      <div class="scope-grid" id="scope-grid">
        <div class="loading">Loading scopes...</div>
      </div>
    </div>
  </div>

  <!-- New Update Set Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="modal">
      <h2>New Update Set</h2>
      <div>
        <label>Scope</label>
        <input type="text" id="modal-scope" readonly>
      </div>
      <div>
        <label>Name</label>
        <input type="text" id="modal-name" placeholder="Update set name">
      </div>
      <div>
        <label>Description (optional)</label>
        <textarea id="modal-description" placeholder="What this update set is for"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="modal-create-btn" onclick="createUpdateSet()">Create</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
