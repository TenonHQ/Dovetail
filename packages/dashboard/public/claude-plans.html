<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dovetail — Claude Plans</title>
  <script>
    /* Apply the saved theme before first paint to avoid a flash of light. */
    (function () {
      try {
        var t = localStorage.getItem("cp-theme");
        if (t === "dark" || t === "light") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="claude-plans.css" />
</head>
<body class="cp-body">
  <header>
    <div class="header-left">
      <svg class="brand-mark" viewBox="0 0 55 56" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M34.3254 13.7847H48.0563H54.9235V0H48.0563H34.3254H20.5946H6.8637H0V13.7847H6.8637H20.5946V27.5693H34.3254V13.7847Z" fill="#00663C"></path>
        <path d="M54.9235 41.354V27.5693H48.0563H34.3254V41.354H20.5946V27.5693H6.8637H0V41.354V55.1387H20.5946H34.3254H54.9235V41.354Z" fill="#00663C"></path>
      </svg>
      <h1><span>Dovetail</span> Claude Plans</h1>
    </div>
    <div class="header-right">
      <a class="cp-nav-link" href="/">&larr; Update Sets</a>
      <a class="cp-nav-link" href="/prompt-lints">Prompt Lints &rarr;</a>
      <button class="cp-theme-toggle" id="cp-theme-toggle" type="button"
        aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <span class="cp-storage" id="cp-storage" title="storage root"></span>
    </div>
  </header>

  <details class="cp-topics" id="cp-topics" open>
    <summary class="cp-topics-summary">
      <span class="cp-topics-caret" aria-hidden="true">▾</span>
      <span class="cp-topics-title">Topics</span>
      <span class="cp-topics-count" id="cp-topics-count">0</span>
      <button
        type="button"
        class="cp-topics-clear"
        id="cp-topics-clear"
        hidden
        title="Clear topic filter"
        aria-label="Clear topic filter"
      >Clear filter</button>
    </summary>
    <div class="cp-topics-cloud" id="cp-topics-cloud" role="group" aria-label="Plan topics">
      <span class="cp-topics-empty" id="cp-topics-empty">
        No topics yet. Push a plan and topics will appear here.
      </span>
    </div>
  </details>

  <main class="cp-layout">
    <aside class="cp-rail" id="cp-rail">
      <div class="cp-rail-header">
        <span class="cp-rail-title">Plans</span>
        <span class="cp-count" id="cp-count">0</span>
      </div>
      <div class="cp-search">
        <input
          type="search"
          class="cp-search-input"
          id="cp-search-input"
          placeholder="Search plans…  (press / to focus)"
          aria-label="Search plans by title, slug, status, or content"
          autocomplete="off"
          spellcheck="false"
        />
        <button
          type="button"
          class="cp-search-clear"
          id="cp-search-clear"
          aria-label="Clear search"
          title="Clear (Esc)"
          hidden
        >×</button>
      </div>
      <div class="cp-rail-empty" id="cp-rail-empty">
        Waiting for plans. Run <code>push_plan</code> from a Claude Code
        session to populate this list.
      </div>
      <div class="cp-rail-no-match" id="cp-rail-no-match" hidden>
        No plans match <span class="cp-rail-no-match-q" id="cp-rail-no-match-q"></span>.
      </div>
      <ul class="cp-list" id="cp-list"></ul>
    </aside>

    <section class="cp-detail" id="cp-detail">
      <div class="cp-detail-empty" id="cp-detail-empty">
        Select a plan from the left rail.
      </div>
      <article class="cp-detail-body" id="cp-detail-body" hidden>
        <header class="cp-detail-header">
          <h2 id="cp-detail-title"></h2>
          <span class="cp-status-pill" id="cp-detail-status"></span>
          <span class="cp-stamp" id="cp-detail-stamp"></span>
        </header>
        <nav class="cp-tabs">
          <button class="cp-tab active" data-tab="plan">Plan</button>
          <button class="cp-tab" data-tab="prompts">
            Prompt <span class="cp-tab-count" id="cp-prompt-count">0</span>
          </button>
          <button class="cp-tab" data-tab="artifacts">
            Artifacts <span class="cp-tab-count" id="cp-artifact-count">0</span>
          </button>
        </nav>
        <div class="cp-tab-panel" id="cp-tab-plan"></div>
        <div class="cp-tab-panel" id="cp-tab-prompts" hidden></div>
        <div class="cp-tab-panel" id="cp-tab-artifacts" hidden></div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.5/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.6/dist/mermaid.min.js"></script>
  <script src="claude-plans.js"></script>
</body>
</html>
